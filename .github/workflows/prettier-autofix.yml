name: Prettier Auto-fix

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to fix'
        required: true
        default: 'main'

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Prettier and plugin
        run: npm install --no-audit --no-fund --save-dev --save-exact prettier @shopify/prettier-plugin-liquid

      - name: Run Prettier (auto-fix)
        run: npx prettier . --write

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply Prettier fixes" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.inputs.branch }}
